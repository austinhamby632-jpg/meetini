name: Build MeetIn Android and iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses

      - name: Install Android build dependencies
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Build APK
        run: ./gradlew --no-daemon --stacktrace --warning-mode all assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MeetIn-app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  ios:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS simulator app
        run: |
          xcodebuild \
            -project ios/MeetIn.xcodeproj \
            -scheme MeetIn \
            -sdk iphonesimulator \
            -configuration Debug \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO build

      - name: Package iOS simulator app
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/Build/Products/Debug-iphonesimulator/MeetIn.app MeetIn-ios-simulator.zip

      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v4
        with:
          name: MeetIn-ios-simulator
          path: MeetIn-ios-simulator.zip
          if-no-files-found: error
          retention-days: 14
